name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

env:
  # Compiles net11.0. The .NET 10 SDK cannot. 10.0.401 is installed for the net10.0 targeting pack and test host.
  DOTNET_VERSION: '11.0.100-rc.1.26425.128'
  DOTNET_LTS_SDK_VERSION: '10.0.401'
  NUGET_PACKAGE_NAME: 'Flume'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          ${{ env.DOTNET_LTS_SDK_VERSION }}
          ${{ env.DOTNET_VERSION }}
        
    - name: Stamp package version
      run: echo "FLUME_VERSION=$(bash eng/package-version.sh)" >> "$GITHUB_ENV"

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{ env.FLUME_VERSION }}
      
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
      
    - name: Pack
      run: dotnet pack src/Flume/Flume.csproj --no-build --configuration Release --output ./nupkgs -p:Version=${{ env.FLUME_VERSION }}
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg
        retention-days: 30

  publish-prerelease:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'v') && (contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc'))
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          ${{ env.DOTNET_LTS_SDK_VERSION }}
          ${{ env.DOTNET_VERSION }}

    - name: Stamp package version
      run: echo "FLUME_VERSION=$(bash eng/package-version.sh)" >> "$GITHUB_ENV"
        
    - name: Pack for prerelease
      run: dotnet pack src/Flume/Flume.csproj --configuration Release --output ./nupkgs -p:Version=${{ env.FLUME_VERSION }}
      
    - name: Publish prerelease to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      
    - name: Create GitHub Pre-release
      uses: softprops/action-gh-release@v1
      with:
        files: ./nupkgs/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-rc')
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          ${{ env.DOTNET_LTS_SDK_VERSION }}
          ${{ env.DOTNET_VERSION }}

    - name: Stamp package version
      run: echo "FLUME_VERSION=$(bash eng/package-version.sh)" >> "$GITHUB_ENV"
        
    - name: Pack for release
      run: dotnet pack src/Flume/Flume.csproj --configuration Release --output ./nupkgs -p:Version=${{ env.FLUME_VERSION }}
      
    - name: Publish to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./nupkgs/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
