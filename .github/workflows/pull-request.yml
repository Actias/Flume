name: Pull Request Checks

on:
  pull_request:
    branches: [ main, dev ]

env:
  # Compiles net11.0. The .NET 10 SDK cannot. 10.0.401 is installed for the net10.0 targeting pack and test host.
  DOTNET_VERSION: '11.0.100-rc.1.26425.128'
  DOTNET_LTS_SDK_VERSION: '10.0.401'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          ${{ env.DOTNET_LTS_SDK_VERSION }}
          ${{ env.DOTNET_VERSION }}

    - name: Stamp package version
      run: echo "FLUME_VERSION=$(bash eng/package-version.sh)" >> "$GITHUB_ENV"
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release -p:Version=${{ env.FLUME_VERSION }}
      
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
      
    - name: Run code analysis
      run: dotnet build --no-restore --configuration Release -p:Version=${{ env.FLUME_VERSION }} /p:RunCodeAnalysis=true
      
    - name: Check for warnings as errors
      run: dotnet build --no-restore --configuration Release -p:Version=${{ env.FLUME_VERSION }} /p:TreatWarningsAsErrors=true
